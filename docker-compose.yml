services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/data
    environment:
      - DATABASE_PATH=/data/lightomation.db
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-3000}
      - ENVIRONMENT=development

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      - backend

volumes:
  sqlite_data:
